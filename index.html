<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash | Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0b10;
            --primary: #00f2ff;
            --secondary: #8a2be2;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.03);
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Premium Navbar */
        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(15px);
            background: var(--glass);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo { font-family: 'Russo One', sans-serif; font-size: 1.5rem; letter-spacing: 2px; }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a1b26 0%, #0a0b10 100%);
            position: relative;
        }

        .hero h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 5rem;
            margin: 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 242, 255, 0.3));
        }

        .hero p { font-size: 1.2rem; opacity: 0.8; max-width: 600px; margin: 20px 0; }

        /* Buttons */
        .cta-container { display: flex; gap: 20px; margin-top: 30px; }

        .btn {
            padding: 12px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid var(--glass-border);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
            border: none;
        }

        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(0, 242, 255, 0.6); }

        .btn-outline { background: var(--glass); color: white; backdrop-filter: blur(5px); }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.1); }

        /* Auth Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .auth-card {
            background: rgba(20, 21, 28, 0.8);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .auth-card h2 {
            font-family: 'Russo One', sans-serif;
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--primary);
        }

        .form-group { margin-bottom: 20px; text-align: left; }

        .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; opacity: 0.7; }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }

        .switch-text { margin-top: 20px; font-size: 0.9rem; opacity: 0.6; }
        .switch-text span { color: var(--primary); cursor: pointer; font-weight: bold; }

        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: none; border: none;
            color: white; font-size: 1.5rem; cursor: pointer; opacity: 0.5;
        }
        .close-btn:hover { opacity: 1; }

        /* Decorative Shapes */
        .cube {
            position: absolute;
            width: 100px; height: 100px;
            border: 2px solid var(--primary);
            opacity: 0.1;
            animation: float 10s infinite linear;
            pointer-events: none;
        }

        @keyframes float {
            from { transform: rotate(0deg) translate(50px) rotate(0deg); }
            to { transform: rotate(360deg) translate(50px) rotate(-360deg); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">GEOMETRY DASH</div>
        <div class="nav-links">
            <a href="#" onclick="openModal('login')" style="color:white; text-decoration:none; margin-right:30px; font-weight:bold;">Login</a>
            <a href="#download" class="btn btn-outline" style="padding: 10px 20px;">Get Started</a>
        </div>
    </nav>

    <section class="hero">
        <div class="cube" style="top:20%; left:10%;"></div>
        <div class="cube" style="bottom:15%; right:15%; border-color:var(--secondary);"></div>
        
        <h1>geometry dash cracked</h1>
        <p>Experience the definitive rhythm-based action platformer. Push your skills to the limit as you jump, fly and flip your way through dangerous passages.</p>
        
        <div class="cta-container" id="download">
            <a href="https://mega.nz/file/jdlERYDB#i5aFjjKKNXn1jUduIjkuRrWqLGlrlLqg71RdmoLKqMM" class="btn btn-primary">Install Cracked</a>
            <button onclick="openModal('signup')" class="btn btn-outline">Create Account</button>
        </div>
    </section>

    <!-- Authentication Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="auth-card">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            
            <!-- Login Form -->
            <div id="loginForm">
                <h2>Login</h2>
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" placeholder="Enter your credentials">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" style="width: 100%;">Sign In</button>
                <p class="switch-text">Don't have an account? <span onclick="toggleForm('signup')">Sign Up</span></p>
            </div>

            <!-- Sign Up Form -->
            <div id="signupForm" style="display: none;">
                <h2>Sign Up</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password">
                </div>
                <button class="btn btn-primary" style="width: 100%; background: var(--secondary); box-shadow: 0 0 30px rgba(138, 43, 226, 0.4);">Register</button>
                <p class="switch-text">Already a member? <span onclick="toggleForm('login')">Login</span></p>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('authModal');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        function openModal(type) {
            modal.style.display = 'flex';
            toggleForm(type);
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function toggleForm(type) {
            if (type === 'login') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            }
        }

        // Close modal when clicking outside the card
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>

</body>
</html>
